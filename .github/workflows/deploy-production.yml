name: Deploy to EC2 (Single Instance)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: momogo-app-storage-2026
  EC2_TAG_NAME: momogo-app-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 (5개 모듈 전체, 그중 api/realtime/batch만 실행 jar 생성됨)
        run: ./gradlew clean build -x test

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: jar 3개 S3 업로드
        run: |
          API_JAR=$(find momogo-api/build/libs -name "*.jar" ! -name "*plain*" | head -n 1)
          RT_JAR=$(find momogo-realtime/build/libs -name "*.jar" ! -name "*plain*" | head -n 1)
          BATCH_JAR=$(find momogo-batch/build/libs -name "*.jar" ! -name "*plain*" | head -n 1)

          aws s3 cp "$API_JAR" "s3://${{ env.S3_BUCKET }}/deploy/api.jar"
          aws s3 cp "$RT_JAR" "s3://${{ env.S3_BUCKET }}/deploy/realtime.jar"
          aws s3 cp "$BATCH_JAR" "s3://${{ env.S3_BUCKET }}/deploy/batch.jar"

      - name: SSM으로 EC2 배포 트리거 (3개 서비스 순차 재시작)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ env.S3_BUCKET }}/deploy/api.jar /home/ec2-user/api.jar",
              "aws s3 cp s3://${{ env.S3_BUCKET }}/deploy/realtime.jar /home/ec2-user/realtime.jar",
              "aws s3 cp s3://${{ env.S3_BUCKET }}/deploy/batch.jar /home/ec2-user/batch.jar",
              "sudo systemctl restart momogo-api",
              "sudo systemctl restart momogo-realtime",
              "sudo systemctl restart momogo-batch"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: 배포 결과 확인 (api 헬스체크만 대표로, realtime/batch는 EC2 안에서 systemctl status로 확인)
        run: |
          sleep 15
          curl -f http://${{ secrets.ALB_DNS_NAME }}/actuator/health