spring:
  application:
    name: momogo-api
  profiles:
    active: dev # 기본 활성화 프로필
    group:
      dev:
        - dev
      prod:
        - prod

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          # 카카오 registration 추가
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 카카오가 제공하는 고유 회원식별자 키 이름 (Integer id)
jwt:
  access-token:
    secret: ${JWT_ACCESS_TOKEN_SECRET}
    exp: ${JWT_ACCESS_TOKEN_EXP}
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN_SECRET}
    exp: ${JWT_REFRESH_TOKEN_EXP}
    cookie:
      secure: ${JWT_REFRESH_COOKIE_SECURE}
      same-site: ${JWT_REFRESH_COOKIE_SAME_SITE}

app:
  super-admin:
    email: ${SUPER_ADMIN_EMAIL}
    password: ${SUPER_ADMIN_PASSWORD}
    name: ${SUPER_ADMIN_NAME}
  jwt:
    registry: memory
  file:
    # 클라이언트용 웹 서비스 URL 주소
    base-url: ${APP_FILE_BASE_URL}
    upload:
      allowed-extensions: jpg,jpeg,png,webp
      allowed-mime-types: image/jpeg,image/png,image/webp
      max-mark-size: 10MB
      # 물리 디스크 저장 경로
      dir: ${APP_FILE_UPLOAD_DIR}
  oauth2:
    success-redirect-url: ${OAuth2_SUCCESS_REDIRECT_URL}
    failure-redirect-url: ${OAuth2_FAILURE_REDIRECT_URL}

server:
  port: 8080
