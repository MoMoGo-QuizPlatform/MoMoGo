plugins {
    id 'org.springframework.boot' version '3.5.15' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
    id 'jacoco'
}

allprojects {
    group = 'org.momogo'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/release' }
    }
}

// 🌟 모든 서브 모듈(core, api, realtime, batch)에 공통 적용되는 설정
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    jacoco {
        toolVersion = "0.8.12"
    }

    dependencies {
        // 모든 모듈이 사용하는 Lombok 설정
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // MapStruct & Lombok 바인딩 설정
        implementation 'org.mapstruct:mapstruct:1.6.3'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        // 모든 모듈이 사용하는 기본 테스트 설정
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport // 테스트 완료 후 JaCoCo 리포트 생성 자동 실행
    }

    jacocoTestReport {
        dependsOn test

        reports {
            xml.required = true
            html.required = true
        }

        // QueryDSL Q클래스 및 보일러플레이트 클래스 커버리지 대상 제외 설정
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/Q*.class",
                        "**/*Application*.class",
                        "**/*Config*.class",
                        "**/*Dto*.class",
                        "**/*Exception*.class",
                        "**/*Request*.class",
                        "**/*Response*.class"
                ])
            }))
        }
    }
}

// 루트 프로젝트에서 서브모듈들의 커버리지 리포트를 통합하여 생성하는 작업
jacocoTestReport {
    description = "Generates an aggregate JaCoCo report from all subprojects"
    dependsOn subprojects.jacocoTestReport

    additionalSourceDirs.setFrom(files(subprojects.sourceSets.main.allSource.srcDirs))
    sourceDirectories.setFrom(files(subprojects.sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(files(subprojects.sourceSets.main.output))
    executionData.setFrom(files(subprojects.jacocoTestReport.executionData))

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/jacocoTestReport.xml')
    }
}