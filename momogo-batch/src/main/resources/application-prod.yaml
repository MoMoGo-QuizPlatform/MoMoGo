spring:
  datasource:
    url: jdbc:postgresql://prod-db-endpoint:5432/momogo_prod
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

logging:
  level:
    root: info
    org.hibernate.SQL: info
